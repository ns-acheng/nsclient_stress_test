[pytest]
# pytest configuration for multi-platform stress testing tool

# Register custom markers for platform-specific tests
markers =
    windows: Tests specific to Windows platform
    linux: Tests specific to Linux platform
    macos: Tests specific to macOS platform
    android: Tests specific to Android platform (requires device)
    ios: Tests specific to iOS platform (requires device and macOS)
    unit: Pure unit tests (fully mocked, no external dependencies)
    integration: Integration tests (may use real services/commands)

# Ensure project root is on sys.path so `pytest` works the same as `python -m pytest`
pythonpath = .

# Test discovery
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    -ra
    -p no:cacheprovider

# Coverage options (if using pytest-cov)
# addopts = --cov=. --cov-report=term-missing
